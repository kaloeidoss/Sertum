name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools
          ndk-version: 30.0.15729638
          cmake-version: 3.31.6

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Privacy and permission audit
        shell: pwsh
        run: ./scripts/privacy_audit.ps1

      - name: Unit tests and core coverage gate
        run: ./gradlew testDebugUnitTest jacocoTestReport jacocoCoverageVerification

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Merged APK permission audit
        shell: pwsh
        run: ./scripts/privacy_audit.ps1 -Apk app/build/outputs/apk/debug/app-debug.apk -Aapt "$env:ANDROID_HOME/build-tools/36.0.0/aapt"
